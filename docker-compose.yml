services:
  kvstore:
    build:
      context: .
      dockerfile: Dockerfile
    image: kvstore:latest
    container_name: kvstore

    # Published on the loopback interface only. Plain "6379:6379" would bind
    # 0.0.0.0 on the host and expose an unauthenticated data store to the
    # network -- and on many setups it also punches straight through the
    # firewall. Drop the 127.0.0.1 prefix only when you have put
    # authentication and TLS in front of it.
    ports:
      - "127.0.0.1:6379:6379"

    # Named volume holding wal.log. This is what makes the data survive
    # `docker compose down` and image rebuilds. For a log you can inspect
    # directly from the host, swap in a bind mount: ./data:/data
    volumes:
      - kvstore-data:/data

    command:
      - "--bind"
      - "0.0.0.0"
      - "--port"
      - "6379"
      - "--wal"
      - "/data/wal.log"
      - "--fsync"
      - "always"

    restart: unless-stopped

    # Under --fsync always|group no write is acknowledged before it is fsynced,
    # and SIGTERM syncs the WAL on the way out. The grace period lets in-flight
    # requests finish rather than seeing a reset connection.
    stop_grace_period: 10s

    healthcheck:
      test: ["CMD", "kvstore-cli", "--host", "127.0.0.1", "--port", "6379", "PING"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    ulimits:
      # One descriptor per connection, plus the log and the wakeup pipe. The
      # default of 1024 caps concurrent clients well below what the server can
      # actually handle.
      nofile:
        soft: 65535
        hard: 65535

volumes:
  kvstore-data:
